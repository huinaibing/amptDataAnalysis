# Condor 提交配置：修改本文件后运行 script/submit_condor.sh。
# 沿用 Bash 变量格式；REPO_DIR 和 SCRIPT_DIR 由提交脚本提供。
# 路径建议使用这两个变量或绝对路径，不依赖运行命令时所在目录。

# 分析任务和输入。MACRO 与 run_parallel.sh 支持相同的入口。
MACRO="calculate_v2ptrho"
INPUT_JSON="$REPO_DIR/config/cent_cfg_hydro_eos.json"
ANALYSIS_JSON="$REPO_DIR/config/$MACRO.json"  # 默认使用所选任务的独立分析配置
OUTPUT_NAME="myAnalysisResultV2PtRho_hydro.root"

# EOS 数据和 worker 的普通 ROOT 环境。
EOS_INPUT_ENDPOINT="root://eosuser.cern.ch"  # 转换输入 JSON 中的 /eos/ 前缀
EOS_OUTPUT_DIR="root://eosuser.cern.ch//eos/user/q/qiuyu/hydro/condor"
ROOT_SETUP="/cvmfs/sft.cern.ch/lcg/views/LCG_108/x86_64-el9-gcc13-opt/setup.sh"

# 分片和调度。
SHARD_COUNT=100            # 分析分片总数
MAX_JOBS=100              # DAG 中同时排队/运行的节点上限
MAX_FILES=-1                # 每个原始 JSON entry 的文件上限；-1 表示全部
MAX_CONFIGS=-1              # 原始 JSON entry 数量上限；-1 表示全部
RETRIES=2                   # 每个节点失败后最多重试两次
SUBMIT_DIR="$SCRIPT_DIR/condor_runs"  # CERN 上应位于 AFS，不要放在 EOS
SUBMIT=true                 # false：只生成文件；true：生成后提交 DAG
